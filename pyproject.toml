[project]
name = "omnivore"
version = "0.1.0"
description = "Universal document ingestion pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]",
    "granian",
    "arq",
    "asyncpg",
    "sqlalchemy[asyncio]>=2.0",
    "alembic",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog",
    "python-magic",
    "aioboto3",
    "redis>=5.0",
    "python-multipart",
    "httpx",
    "pgvector",
]

[project.entry-points."omnivore.handlers"]
# Phase 1: register handlers here

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov",
    "testcontainers[postgres,redis]",
    "ruff>=0.4",
    "pyright>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omnivore"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["omnivore"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
