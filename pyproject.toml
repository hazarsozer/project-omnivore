[project]
name = "omnivore"
version = "0.1.0"
description = "Universal document ingestion pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]",
    "granian",
    "arq",
    "asyncpg",
    "sqlalchemy[asyncio]>=2.0",
    "alembic",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog",
    "python-magic",
    "aioboto3",
    "redis>=5.0",
    "python-multipart",
    "httpx",
    "pgvector",
    "pymupdf",
    "pdfplumber",
    "python-docx",
    "markdown-it-py",
    "selectolax",
    "polars",
    "openpyxl",
    "tiktoken",
    "sentence-transformers>=5.4.1",
    "faster-whisper>=1.2.1",
    "easyocr>=1.7.2",
    "einops>=0.8.2",
]

[project.entry-points."omnivore.handlers"]
pdf = "omnivore.pipeline.handlers.pdf:PdfHandler"
docx = "omnivore.pipeline.handlers.docx:DocxHandler"
text = "omnivore.pipeline.handlers.text:PlainTextHandler"
markdown = "omnivore.pipeline.handlers.text:MarkdownHandler"
html = "omnivore.pipeline.handlers.html:HtmlHandler"
json = "omnivore.pipeline.handlers.json_handler:JsonHandler"
csv = "omnivore.pipeline.handlers.csv_handler:CsvHandler"
xlsx = "omnivore.pipeline.handlers.xlsx:XlsxHandler"
audio = "omnivore.pipeline.handlers.audio:AudioHandler"
video = "omnivore.pipeline.handlers.video:VideoHandler"
image-ocr = "omnivore.pipeline.handlers.image:ImageOcrHandler"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov",
    "testcontainers[postgres,redis]",
    "ruff>=0.4",
    "pyright>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omnivore"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["omnivore"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires Docker (skip with -m 'not integration')",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
