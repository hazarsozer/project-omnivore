global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: omnivore-api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics
    authorization:
      credentials: "${METRICS_AUTH_TOKEN}"

  - job_name: omnivore-worker
    static_configs:
      - targets: ["worker:9101"]
    metrics_path: /metrics
    authorization:
      credentials: "${METRICS_AUTH_TOKEN}"

  - job_name: omnivore-worker-gpu
    static_configs:
      - targets: ["worker-gpu:9102"]
    metrics_path: /metrics
    authorization:
      credentials: "${METRICS_AUTH_TOKEN}"
