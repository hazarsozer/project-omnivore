server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # NOTE: This regex assumes COMPOSE_PROJECT_NAME=omnidoc-ingest (the default).
      # If you run the stack from a differently-named directory or with a custom
      # COMPOSE_PROJECT_NAME, update this regex to match your actual container names.
      - source_labels: [__meta_docker_container_name]
        regex: "/omnidoc-ingest-(.*)-1"
        target_label: service
      - source_labels: [__meta_docker_container_name]
        target_label: container
    pipeline_stages:
      - json:
          expressions:
            level: level
            event: event
            trace_id: trace_id
      - labels:
          level:
          event:
          trace_id:
