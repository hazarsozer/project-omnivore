apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: omnivore-prometheus
    url: http://prometheus:9090
    access: proxy
    isDefault: true
    jsonData:
      httpMethod: POST

  - name: Loki
    type: loki
    uid: omnivore-loki
    url: http://loki:3100
    access: proxy
    jsonData:
      derivedFields:
        - datasourceUid: omnivore-tempo
          matcherRegex: '(?:"trace_id":\s*"|trace_id=)([a-f0-9]{32})'
          name: TraceID
          url: "${__value.raw}"

  - name: Tempo
    type: tempo
    uid: omnivore-tempo
    url: http://tempo:3200
    access: proxy
    jsonData:
      lokiSearch:
        datasourceUid: omnivore-loki
