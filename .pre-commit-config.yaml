repos:
  # Ruff: lint + autofix, then format
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Fast unit tests — skips integration/chaos (needs infra)
  - repo: local
    hooks:
      - id: pytest-unit
        name: pytest (unit tests only)
        entry: uv run pytest tests/unit/ -q --tb=short
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]
