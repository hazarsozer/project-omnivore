services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: omnivore
      POSTGRES_PASSWORD: omnivore
      POSTGRES_DB: omnivore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnivore"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: omnivore
      MINIO_ROOT_PASSWORD: omnivore123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # L-6: When running with --profile monitoring, set OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318
    # in your .env file (NOT http://localhost:4318 — that resolves to the container itself).
    command: uvicorn omnivore.api.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    env_file: .env
    volumes:
      - ./src:/app/src
    # L-6: When running with --profile monitoring, set OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318
    # in your .env file (NOT http://localhost:4318 — that resolves to the container itself).
    # Port 9101 (Prometheus metrics) is NOT published to the host: Prometheus
    # reaches it via the internal Compose network as "worker:9101". Exposing it
    # to 0.0.0.0 would leak tenant_id-labeled series (the worker /metrics
    # endpoint is unauthenticated — see prometheus_client.start_http_server).
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: python -m omnivore.worker.main

  # GPU worker — processes arq:gpu queue (audio, video, OCR handlers).
  # Requires NVIDIA Container Toolkit (nvidia-docker): docker compose --profile gpu up -d worker-gpu
  # Without NVIDIA Container Toolkit, run host-side instead:
  #   uv run python -m omnivore.worker.gpu_main
  # Verified: host-side startup confirmed on 2026-05-07 (gpu_worker.startup handlers=11).
  worker-gpu:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    env_file: .env
    volumes:
      - ./src:/app/src
    # Port 9102 (Prometheus metrics) is NOT published to the host — same reason
    # as the `worker` service above. Prometheus scrapes via "worker-gpu:9102"
    # over the internal Compose network.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: python -m omnivore.worker.gpu_main
    profiles:
      - gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ---- Observability stack (opt-in: docker compose --profile monitoring up -d) ----

  tempo:
    image: grafana/tempo:latest
    profiles: [monitoring]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "4318:4318"
      - "3200:3200"

  prometheus:
    image: prom/prometheus:latest
    profiles: [monitoring]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Bearer token for /metrics scraping. File contains the raw token (no
      # "Bearer " prefix). Generate with: openssl rand -hex 32 > observability/auth_token
      # Must match METRICS_AUTH_TOKEN in the API's .env. The file is gitignored.
      - ./observability/auth_token:/etc/prometheus/auth_token:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"

  loki:
    image: grafana/loki:latest
    profiles: [monitoring]
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    command: ["-config.file=/etc/loki/loki-config.yaml"]

  promtail:
    image: grafana/promtail:latest
    profiles: [monitoring]
    volumes:
      - ./observability/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["-config.file=/etc/promtail/promtail-config.yaml"]
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    profiles: [monitoring]
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      # Port 3001 to avoid conflict with the Next.js frontend dev server on 3000
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  postgres_data:
  redis_data:
  minio_data:
  tempo_data:
  prometheus_data:
  loki_data:
  grafana_data:
